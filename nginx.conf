server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Every path that is not a real file falls back to index.html so
    # React Router can handle client-side navigation.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Long-lived cache for hashed static assets ─────────────────────────────
    # Vite appends a content-hash to every JS/CSS filename so they can be
    # cached forever without any stale-content risk.
    location ~* \.(js|mjs|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;
}
