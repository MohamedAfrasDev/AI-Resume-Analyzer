server {
    listen 80;
    server_name _;

    # ── Redirect bare root to the app's base path ────────────────────────────
    location = / {
        return 301 /AI-Resume-Analyzer/;
    }

    # ── Serve the SPA ─────────────────────────────────────────────────────────
    # try_files falls back to index.html so React Router can handle every
    # client-side path (e.g. /AI-Resume-Analyzer/resume/abc123).
    location /AI-Resume-Analyzer/ {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /AI-Resume-Analyzer/index.html;
    }

    # ── Long-lived cache for hashed static assets ─────────────────────────────
    # Vite appends a content-hash to every JS/CSS filename, so these can be
    # cached forever without stale-content risk.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Suppress nginx version from error pages / headers
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;
}
